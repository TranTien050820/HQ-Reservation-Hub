<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <!-- No `sizes="any"` — that marks an icon as scalable and makes Chrome skip
         the .ico in favour of a /favicon.ico guess that 404s behind a router. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Hotess HQ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#eef1f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)" />
    <title>Hotess HQ — Reception</title>
    <script>
      // Runs before the first paint so the app never flashes the wrong palette.
      // Key and values must match src/store/ThemeContext.tsx.
      (function () {
        try {
          var saved = localStorage.getItem('hotess.theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
